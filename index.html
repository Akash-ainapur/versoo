<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<title>Reel Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EC; --surface:#FFFDF9; --sunken:#EFEBE4; --hover:#F3EFE8;
  --ink:#1A1714; --ink2:#5C554C; --ink3:#968C7F;
  --border:#E6DFD4; --border2:#D3CABC;
  --met:#2D7A4D; --met-bg:#E4F0E6; --miss:#B2432D; --miss-bg:#F8E6E1;
  --unc:#946A0C; --unc-bg:#F6EDD3; --req:#3A53A5; --req-bg:#E6EAF7; --wait:#776E63; --wait-bg:#ECE8E1;
  --shadow:0 1px 2px rgba(40,30,20,.04), 0 6px 20px rgba(40,30,20,.05);
  --pop:0 2px 6px rgba(40,30,20,.06), 0 16px 40px rgba(40,30,20,.14);
  --panel:#1A1714; --panel-ink:#F5F2EC; --panel-soft:#A89F93;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131110; --surface:#1B1816; --sunken:#221F1C; --hover:#24211D;
    --ink:#EFE9DF; --ink2:#B0A698; --ink3:#7B7166;
    --border:#2C2824; --border2:#3C362F;
    --met:#7CC59A; --met-bg:#1C2A21; --miss:#EF8F77; --miss-bg:#34211C;
    --unc:#E0BA5E; --unc-bg:#302816; --req:#9FB1F2; --req-bg:#1F253A; --wait:#A79D90; --wait-bg:#262320;
    --shadow:0 1px 2px rgba(0,0,0,.3); --pop:0 16px 40px rgba(0,0,0,.5);
    --panel:#0C0B0A; --panel-ink:#EFE9DF; --panel-soft:#8F867A;
  }
}
:root[data-theme="dark"]{
  --bg:#131110; --surface:#1B1816; --sunken:#221F1C; --hover:#24211D;
  --ink:#EFE9DF; --ink2:#B0A698; --ink3:#7B7166;
  --border:#2C2824; --border2:#3C362F;
  --met:#7CC59A; --met-bg:#1C2A21; --miss:#EF8F77; --miss-bg:#34211C;
  --unc:#E0BA5E; --unc-bg:#302816; --req:#9FB1F2; --req-bg:#1F253A; --wait:#A79D90; --wait-bg:#262320;
  --shadow:0 1px 2px rgba(0,0,0,.3); --pop:0 16px 40px rgba(0,0,0,.5);
  --panel:#0C0B0A; --panel-ink:#EFE9DF; --panel-soft:#8F867A;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Geist',ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--ink); color:var(--bg)}
a{color:inherit}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:6px}
h1,h2,h3,p{margin:0}
svg{flex:none}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- primitives ---------- */
.i{width:18px; height:18px}
.i-sm{width:15px; height:15px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 16px;
  border-radius:10px; font-size:14px; font-weight:500; white-space:nowrap; text-decoration:none;
  border:1px solid var(--border2); background:var(--surface); color:var(--ink);
  transition:background .15s, border-color .15s, opacity .15s, transform .1s;
}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.btn.primary:hover{opacity:.88; background:var(--ink)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink2)}
.btn.ghost:hover{background:var(--sunken); color:var(--ink)}
.btn.sm{height:32px; padding:0 12px; font-size:13px; border-radius:8px}
.btn.lg{height:46px; padding:0 22px; font-size:15px; border-radius:12px}
.btn:disabled{opacity:.5; cursor:default; transform:none}
.icon-btn{width:32px; height:32px; border-radius:8px; display:inline-grid; place-items:center; color:var(--ink2)}
.icon-btn:hover{background:var(--sunken); color:var(--ink)}

.input, textarea.input{
  width:100%; font:inherit; font-size:14.5px; color:var(--ink); background:var(--surface);
  border:1px solid var(--border2); border-radius:10px; padding:10px 12px; transition:border-color .15s, box-shadow .15s;
}
textarea.input{resize:none; line-height:1.6; min-height:88px; display:block}
.input::placeholder{color:var(--ink3)}
.input:focus{outline:none; border-color:var(--ink); box-shadow:0 0 0 3px color-mix(in srgb, var(--ink) 10%, transparent)}

.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow)}
.card-h{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--border)}
.card-h h2, .card-h h3{font-size:15px; font-weight:600}
.card-b{padding:20px}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.small{font-size:13px}

.pill{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px 0 8px; border-radius:999px; font-size:12.5px; font-weight:500; white-space:nowrap}
.pill::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor}
.p-waiting{background:var(--wait-bg); color:var(--wait)}
.p-review{background:var(--unc-bg); color:var(--unc)}
.p-changes{background:var(--req-bg); color:var(--req)}
.p-approved{background:var(--met-bg); color:var(--met)}

.si{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; flex:none}
.si svg{width:14px; height:14px}
.si-pass{background:var(--met-bg); color:var(--met)}
.si-miss{background:var(--miss-bg); color:var(--miss)}
.si-unsure{background:var(--unc-bg); color:var(--unc)}
.si-pending{background:var(--sunken)}
.si-pending::after{content:''; width:6px; height:6px; border-radius:50%; background:var(--ink3)}

.kind-tag{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--ink3); font-weight:500}
.kind-tag svg{width:13px; height:13px}

/* menus */
.menu{position:relative}
.menu > summary{list-style:none}
.menu > summary::-webkit-details-marker{display:none}
.menu-pop{
  position:absolute; right:0; top:calc(100% + 6px); min-width:210px; z-index:30;
  background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--pop); padding:6px;
}
.menu-pop button, .menu-pop a{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 10px;
  border-radius:8px; font-size:13.5px; color:var(--ink); text-decoration:none;
}
.menu-pop button:hover, .menu-pop a:hover{background:var(--sunken)}
.menu-pop .danger{color:var(--miss)}
.menu-pop hr{border:0; border-top:1px solid var(--border); margin:6px 4px}
.menu-pop .lbl{font-size:11.5px; color:var(--ink3); padding:6px 10px 2px; text-transform:uppercase; letter-spacing:.06em; font-weight:500}

.spin{width:16px; height:16px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- brand shell ---------- */
.app{display:grid; grid-template-columns:260px minmax(0,1fr); min-height:100vh}
.side{
  position:sticky; top:0; height:100vh; background:var(--surface); border-right:1px solid var(--border);
  padding:18px 14px; display:flex; flex-direction:column; gap:6px;
}
.logo{display:flex; align-items:center; gap:10px; font-weight:600; font-size:15.5px; letter-spacing:-.01em; padding:2px 8px 16px; text-decoration:none}
.glyph{width:30px; height:30px; border-radius:9px; background:var(--ink); color:var(--bg); display:grid; place-items:center}
.glyph svg{width:14px; height:14px}
.camp-box{margin:0 4px 14px; padding:12px; border-radius:12px; background:var(--sunken)}
.camp-box .k{font-size:11.5px; color:var(--ink3); text-transform:uppercase; letter-spacing:.06em; font-weight:500}
.camp-box .t{font-weight:600; font-size:14px; margin-top:2px; line-height:1.35}
.nav{display:flex; flex-direction:column; gap:2px}
.nav a{
  display:flex; align-items:center; gap:10px; height:40px; padding:0 10px; border-radius:10px;
  color:var(--ink2); text-decoration:none; font-size:14px; font-weight:500;
}
.nav a:hover{background:var(--hover); color:var(--ink)}
.nav a[aria-current]{background:var(--sunken); color:var(--ink)}
.nav .badge{margin-left:auto; min-width:22px; height:20px; padding:0 7px; border-radius:999px; background:var(--unc-bg); color:var(--unc); font-size:12px; display:grid; place-items:center; font-weight:600}
.side-foot{margin-top:auto; padding:12px 8px 0; border-top:1px solid var(--border); font-size:12.5px; color:var(--ink3); line-height:1.5}
.side-foot button{color:var(--ink2); text-decoration:underline; text-underline-offset:3px; margin-top:6px; font-size:12.5px}

.main{min-width:0}
.page-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px 24px; padding:32px 40px 24px; flex-wrap:wrap}
.page-head h1{font-size:26px; font-weight:600; letter-spacing:-.025em; line-height:1.2; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.page-head .sub{color:var(--ink2); margin-top:6px}
.page-head .acts{display:flex; gap:10px; flex-wrap:wrap}
.crumb{display:inline-flex; align-items:center; gap:6px; color:var(--ink2); text-decoration:none; font-size:13.5px; margin-bottom:10px}
.crumb:hover{color:var(--ink)}
.crumb svg{width:15px; height:15px}
.content{padding:0 40px 64px}

/* stats */
.stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; margin-bottom:20px}
.stat{padding:16px 18px}
.stat .k{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink2)}
.stat .k i{width:8px; height:8px; border-radius:50%}
.stat .v{font-size:28px; font-weight:600; letter-spacing:-.02em; margin-top:6px; font-variant-numeric:tabular-nums}

/* table */
.tbl{width:100%; border-collapse:collapse}
.tbl th{font-size:12px; font-weight:500; color:var(--ink3); text-align:left; padding:12px 20px; border-bottom:1px solid var(--border); text-transform:uppercase; letter-spacing:.05em}
.tbl td{padding:14px 20px; border-bottom:1px solid var(--border); vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--hover)}
.who{display:flex; align-items:center; gap:12px; font-weight:500}
.av{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:12.5px; font-weight:600; color:#1A1714; flex:none}
.meter{display:flex; gap:2px; width:120px; height:6px; border-radius:99px; overflow:hidden; background:var(--sunken)}
.meter span{height:100%}
.meter .m{background:var(--met)} .meter .u{background:var(--unc)} .meter .x{background:var(--miss)}
.meter-l{font-size:12.5px; color:var(--ink2); margin-top:6px; font-variant-numeric:tabular-nums}
.row-acts{display:flex; gap:6px; justify-content:flex-end; align-items:center}
.add-bar{display:flex; gap:10px; padding:16px 20px; border-bottom:1px solid var(--border); background:var(--sunken); border-radius:16px 16px 0 0}
.add-bar .input{background:var(--surface)}

.empty{padding:56px 24px; text-align:center; display:grid; justify-items:center; gap:8px}
.empty .ic{width:48px; height:48px; border-radius:14px; background:var(--sunken); display:grid; place-items:center; color:var(--ink2); margin-bottom:6px}
.empty h3{font-size:16px; font-weight:600}
.empty p{color:var(--ink2); max-width:42ch}
.empty .btn, .empty form{margin-top:10px}
.empty form{display:flex; gap:10px; width:min(100%, 420px)}

/* checklist editor */
.groups{display:grid; gap:16px}
.group-h{display:flex; gap:14px; padding:18px 20px; border-bottom:1px solid var(--border); align-items:flex-start}
.gi{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; flex:none}
.gi-speech{background:var(--req-bg); color:var(--req)}
.gi-caption{background:var(--met-bg); color:var(--met)}
.gi-manual{background:var(--unc-bg); color:var(--unc)}
.group-h h3{font-size:15px; font-weight:600; display:flex; gap:8px; align-items:center}
.group-h .count{font-size:12px; color:var(--ink3); font-weight:500; background:var(--sunken); padding:1px 8px; border-radius:99px}
.group-h p{color:var(--ink2); font-size:13.5px; margin-top:2px}
.reqs{list-style:none; margin:0; padding:0}
.req{display:flex; align-items:center; gap:12px; padding:12px 12px 12px 20px; border-bottom:1px solid var(--border); min-height:54px}
.req .num{width:22px; font-size:12.5px; color:var(--ink3); font-variant-numeric:tabular-nums; flex:none}
.req .t{flex:1; min-width:0}
.req.editing{gap:10px; flex-wrap:wrap}
.req.editing .input{flex:1 1 280px}
.add-req{display:flex; align-items:center; gap:8px; width:100%; padding:14px 20px; color:var(--ink2); font-size:13.5px; font-weight:500; border-radius:0 0 16px 16px}
.add-req:hover{background:var(--hover); color:var(--ink)}
.add-req svg{width:16px; height:16px}
.add-form{display:flex; gap:10px; padding:12px 20px 16px; flex-wrap:wrap}
.add-form .input{flex:1 1 260px}

/* ---------- setup wizard ---------- */
.wiz{display:grid; grid-template-columns:400px minmax(0,1fr); min-height:100vh}
.wiz-side{
  background:var(--panel); color:var(--panel-ink); padding:32px 36px; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.wiz-side .logo{color:var(--panel-ink); padding:0 0 48px}
.wiz-side .glyph{background:var(--panel-ink); color:var(--panel)}
.wiz-side h2{font-size:26px; line-height:1.25; font-weight:600; letter-spacing:-.02em}
.wiz-side .lead{color:var(--panel-soft); margin-top:12px; font-size:14.5px; max-width:34ch}
.steps{list-style:none; padding:0; margin:44px 0 0; display:grid; gap:4px}
.steps li{display:grid; grid-template-columns:32px 1fr; gap:14px; padding:10px 0; position:relative}
.steps li:not(:last-child)::after{content:''; position:absolute; left:15px; top:44px; bottom:-6px; width:2px; background:#3A342E; border-radius:2px}
.steps .dot{width:32px; height:32px; border-radius:50%; border:1.5px solid #4A433B; display:grid; place-items:center; font-size:13px; font-weight:600; color:var(--panel-soft)}
.steps .dot svg{width:15px; height:15px}
.steps .on .dot{background:var(--panel-ink); color:var(--panel); border-color:var(--panel-ink)}
.steps .done .dot{background:#2F5E43; border-color:#2F5E43; color:#E4F0E6}
.steps b{display:block; font-weight:600; font-size:14.5px; margin-top:5px}
.steps span{color:var(--panel-soft); font-size:13px}
.steps .on b{color:var(--panel-ink)} .steps li:not(.on):not(.done) b{color:var(--panel-soft)}
.wiz-side .foot{margin-top:auto; color:var(--panel-soft); font-size:12.5px}
.wiz-main{padding:56px 64px 80px; max-width:900px; width:100%}
.wiz-main .eyebrow{font-size:13px; color:var(--ink3); font-weight:500}
.wiz-main h1{font-size:30px; font-weight:600; letter-spacing:-.025em; margin-top:6px}
.wiz-main .sub{color:var(--ink2); margin-top:8px; font-size:15px; max-width:60ch}
.wiz-body{margin-top:28px}
.wiz-foot{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:28px; flex-wrap:wrap}
.brief-box{padding:4px}
.brief-box textarea{border:0; box-shadow:none !important; min-height:360px; background:transparent; font-size:14.5px; padding:16px}
.brief-tools{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border-top:1px solid var(--border); flex-wrap:wrap}
.warn{color:var(--miss); font-size:13.5px; margin-top:12px}
.note{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px; background:var(--sunken); color:var(--ink2); font-size:13.5px}
.note svg{width:16px; height:16px; margin-top:2px}

/* ---------- review ---------- */
.rv{display:grid; grid-template-columns:360px minmax(0,1fr); gap:24px; align-items:start}
.rv-left{position:sticky; top:20px; display:grid; gap:16px}
.frame{aspect-ratio:9/16; width:100%; background:#0E0D0C; border-radius:12px; overflow:hidden; display:grid; place-items:center}
.frame video{width:100%; height:100%; object-fit:contain; background:#000; display:block}
.frame .nofile{color:#A89F93; font-size:13px; text-align:center; padding:24px; display:grid; gap:8px; justify-items:center}
.vcard{padding:12px}
.vmeta{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 4px 2px; flex-wrap:wrap}
.seg{display:inline-flex; background:var(--sunken); border-radius:9px; padding:3px; gap:2px}
.seg a{padding:4px 12px; border-radius:7px; font-size:13px; font-weight:500; color:var(--ink2); text-decoration:none}
.seg a[aria-current]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.textcard .card-b{padding:14px 18px 16px}
.textcard .k{font-size:12px; font-weight:500; color:var(--ink3); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px}
.textcard .v{white-space:pre-wrap; overflow-wrap:anywhere; font-size:14px}
.textcard .v.clamp{display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden}
.textcard .none{color:var(--ink3); font-style:italic}
.textcard button{margin-top:8px; font-size:13px; color:var(--ink2); text-decoration:underline; text-underline-offset:3px}
.sum{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.sum span{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums}
.sum i{width:8px; height:8px; border-radius:50%}
.sec-l{font-size:12px; font-weight:500; color:var(--ink3); text-transform:uppercase; letter-spacing:.05em; padding:14px 20px 6px; display:flex; justify-content:space-between; align-items:center}
.res-list{list-style:none; margin:0; padding:0}
.res{display:grid; grid-template-columns:24px minmax(0,1fr) auto; gap:14px; padding:14px 20px; border-top:1px solid var(--border); align-items:start}
.res-t{font-size:14.5px; font-weight:500}
.res-meta{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; margin-top:4px}
.ev{font-size:13.5px; color:var(--ink2)}
.ev.quote{font-style:italic}
.over-note{font-size:12.5px; color:var(--ink3); margin-top:6px}
.res-acts{display:flex; gap:4px; align-items:center}
.ask{margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--req-bg); color:var(--ink)}
.ask .k{font-size:12px; font-weight:600; color:var(--req); display:flex; gap:6px; align-items:center}
.ask .k svg{width:14px; height:14px}
.ask p{margin-top:3px; font-size:14px}
.ask-form{margin-top:10px; display:grid; gap:8px}
.ask-form .row{display:flex; gap:8px}
.banner{display:flex; align-items:center; gap:10px; padding:12px 16px; border-radius:12px; margin-bottom:16px; font-size:14px}
.banner svg{width:17px; height:17px}
.banner.req{background:var(--req-bg); color:var(--req)}
.banner.met{background:var(--met-bg); color:var(--met)}
.allgood{padding:16px 20px; border-top:1px solid var(--border); color:var(--met); display:flex; gap:10px; align-items:center; font-size:14px}
.allgood svg{width:16px; height:16px}
details.fold > summary{list-style:none; cursor:pointer}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary .chev{transition:transform .15s; width:15px; height:15px}
details.fold[open] > summary .chev{transform:rotate(180deg)}
.mob-dock{display:none}

/* ---------- creator ---------- */
.ctop{position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border)}
.ctop-in{max-width:1120px; margin:0 auto; padding:12px 24px; display:flex; align-items:center; gap:16px}
.ctop .logo{padding:0}
.ctop .camp{color:var(--ink2); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; padding-left:16px; border-left:1px solid var(--border)}
.ctop .me{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:500; white-space:nowrap}
.ctop .me .av{width:30px; height:30px; font-size:12px}
.cwrap{max-width:1120px; margin:0 auto; padding:36px 24px 96px}
.chead{margin-bottom:24px}

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   Reel Check
   Swap points for the AWS build plan:
     ai()   -> OpenRouter today (api/ai.py); Bedrock later, same shapes
     api    -> localStorage today; API Gateway + Lambda + DynamoDB (Step A)
     vids   -> IndexedDB today; presigned S3 upload (Step B)
   parseBrief() and runCheck() are the offline fallbacks when AI is down.
   ===================================================================== */

const SAMPLE = `invideo Editor: Effects Library

What your video should show
- The finished edit or effect.
- The footage or reference you started with.
- The direction or prompt you gave the agent, and the work it performed.
- The editable timeline and any refinements you made.

What should land
- invideo has launched invideo Editor. You can sign up and start using it for free.
- Tell its agents what editing work you want done. They handle the repetitive steps directly on your timeline.
- You can keep directing the agent or refine the result with manual controls.

Working with the agent
- Use your own footage where possible.
- Use invideo Editor agents in Ultra mode.

CTA and publishing
- CTA: invideo Editor is free to use. Sign up and start creating.
- Comment "invideo" to get access to invideo Editor and my project timeline.
- Tag and add as collaborators: @invideo.io and @invideo.creators`;

/* ---------------------------------------------------------------------
   AI (server-side, key never in the browser)
   --------------------------------------------------------------------- */
async function ai(task, payload){
  const r = await fetch('api/ai', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({task, ...payload})});
  const data = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(data.error || 'HTTP ' + r.status);
  return data;
}

/* ---------------------------------------------------------------------
   Offline fallbacks
   --------------------------------------------------------------------- */
const STOP = new Set(('the a an and or to of in on for your you with it its is are that this they them can keep make give any own from at by as into their was were be been have has do does did get got how what which when use used using also more most each every all not no one two my our we i he she his her if then than so up out about just like want will would should could may might must shall ' +
  'tell say says mention show shows showing start started done work handle directly steps where possible video there here make sure include').split(' '));
const BULLET = /^\s*(?:[-•●▪*–]|\d+[.)])\s+/;
function kindFromLine(line){
  const l = line.toLowerCase();
  if(/[@#][a-z0-9._]/i.test(line) || /\b(caption|tag|tags|comment|collaborators?|hashtags?|description)\b/.test(l)) return 'caption';
  if(/\b(say|says|tell|mention|sign ?up|free|launched|launch|cta|voiceover|voice-over|explain|talk|call out)\b/.test(l)) return 'speech';
  return null;
}
function kindFromHeading(h){
  const l = (h || '').toLowerCase();
  if(/\b(show|visual|on screen|footage|shot|shots|b-roll)\b/.test(l)) return 'manual';
  if(/\b(caption|publish|publishing|posting|tags?)\b/.test(l)) return 'caption';
  if(/\b(land|say|script|voice|message|talking|key points?)\b/.test(l)) return 'speech';
  return null;
}
function termsFor(line, kind){
  if(kind === 'manual') return [];
  const handles = line.match(/[@#][a-zA-Z0-9._]*[a-zA-Z0-9_]/g) || [];
  const quoted = (line.match(/["“]([^"”]+)["”]/g) || []).map(s => s.replace(/["“”]/g,'').toLowerCase());
  if(handles.length || quoted.length) return [...new Set([...handles.map(h => h.toLowerCase()), ...quoted])];
  const phrases = /\bsign[\s-]?up\b/i.test(line) ? ['sign up'] : [];
  const words = line.toLowerCase().replace(/sign[\s-]?up/g,' ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w => w.length > 3 && !STOP.has(w));
  return [...new Set([...phrases, ...words])].slice(0,5);
}
function parseBrief(text){
  const lines = text.split(/\r?\n/), hasBullets = lines.some(l => BULLET.test(l));
  const out = []; let heading = '';
  lines.forEach((raw, i) => {
    const t = raw.trim(); if(!t) return;
    if(hasBullets && !BULLET.test(raw)){ heading = t; return; }
    const line = t.replace(BULLET,'').trim();
    if(line.length < 12 || (!hasBullets && (i === 0 || /:$/.test(line)))){ heading = line; return; }
    const kind = kindFromLine(line) || kindFromHeading(heading) || 'manual';
    out.push({id: uid('i'), text: line, kind, terms: termsFor(line, kind)});
  });
  return out;
}
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function found(hay, term){
  if(/[\s@#]/.test(term)) return hay.includes(term);
  const stem = term.length > 5 ? term.replace(/(ing|ed|es|s)$/,'') : term;
  return new RegExp('(^|[^a-z0-9])' + reEsc(stem)).test(hay);
}
function runCheck(item, sub){
  if(item.kind === 'manual') return {verdict: sub.ticks && sub.ticks[item.id] ? 'pass' : 'miss', evidence:''};
  const hay = ((item.kind === 'caption' ? sub.caption : sub.script) || '').toLowerCase().replace(/\s+/g,' ');
  const terms = (item.terms && item.terms.length ? item.terms : termsFor(item.text, item.kind)).map(t => t.toLowerCase());
  const where = item.kind === 'caption' ? 'caption' : 'script';
  if(!hay.trim()) return {verdict:'miss', evidence:`The ${where} is empty.`};
  if(!terms.length) return {verdict:'unsure', evidence:'Needs a human look.'};
  const gone = terms.filter(t => !found(hay, t));
  if(!gone.length) return {verdict:'pass', evidence:`Mentioned in the ${where}.`};
  if(item.kind === 'caption') return {verdict:'miss', evidence:`Missing from the caption: ${gone.join(', ')}.`};
  if(gone.length < terms.length) return {verdict:'unsure', evidence:'Partly covered, may be worded differently.'};
  return {verdict:'miss', evidence:'Not mentioned in the script.'};
}
function titleOf(text){
  const first = (text || '').split(/\r?\n/).map(s => s.trim()).find(Boolean) || '';
  return BULLET.test(first) || first.length > 80 ? 'Untitled campaign' : first;
}

/* ---------------------------------------------------------------------
   Build a checklist, check a submission (AI first, fallback second)
   --------------------------------------------------------------------- */
async function buildChecklist(text){
  try{
    const d = await ai('checklist', {brief: text});
    if(!d.items || !d.items.length) throw new Error('empty');
    return {items: d.items.map(it => ({id: uid('i'), text: it.text, kind: it.kind, terms: it.terms || []})), by:'ai'};
  }catch(e){
    console.warn('AI checklist unavailable, using the simple parser:', e.message);
    return {items: parseBrief(text), by:'simple'};
  }
}
async function checkSubmission(sub){
  const items = S.campaign.items, res = {};
  items.filter(i => i.kind === 'manual').forEach(i => res[i.id] = runCheck(i, sub));
  const auto = items.filter(i => i.kind !== 'manual');
  let by = 'ai';
  try{
    const d = await ai('check', {items: auto.map(({id, text, kind}) => ({id, text, kind})), caption: sub.caption, script: sub.script});
    d.results.forEach(r => { res[r.id] = {verdict: r.verdict, evidence: r.evidence, quote: r.verdict === 'pass'}; });
  }catch(e){ console.warn('AI check unavailable, using keyword matching:', e.message); by = 'simple'; }
  auto.forEach(i => { if(!res[i.id]) res[i.id] = runCheck(i, sub); });
  return {results: res, by};
}

/* ---------------------------------------------------------------------
   api: the four Step A endpoints. localStorage today.
   --------------------------------------------------------------------- */
const KEY = 'reelcheck.v3';
const blank = () => ({campaign:null, creators:[], subs:{}});
function readLocal(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return blank(); }
function writeLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = readLocal();
const api = {
  async load(){ S = readLocal(); },
  async saveCampaign(c){ S.campaign = c; writeLocal(); },
  async registerCreator(name){ const c = {id:uid('u'), name, addedAt:Date.now()}; S.creators.push(c); writeLocal(); return c; },
  async submit(cid, v){ (S.subs[cid] = S.subs[cid] || {versions:[]}).versions.push(v); writeLocal(); },
  async review(cid, n, review){ const v = version(cid, n); if(v){ v.review = review; writeLocal(); } },
  async reset(){ S = blank(); writeLocal(); }
};

/* vids: reel files in IndexedDB so the brand's tab can play them. Step B -> S3. */
const vids = (() => {
  let p; const urls = {};
  const db = () => p = p || new Promise((res, rej) => {
    const r = indexedDB.open('reelcheck', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('videos');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return {
    async put(key, blob, url){
      if(url) urls[key] = url;
      try{ const d = await db(); await new Promise((res, rej) => { const t = d.transaction('videos','readwrite'); t.objectStore('videos').put(blob, key); t.oncomplete = res; t.onerror = () => rej(t.error); }); }catch(e){}
    },
    async url(key){
      if(urls[key]) return urls[key];
      try{
        const d = await db();
        const blob = await new Promise((res, rej) => { const g = d.transaction('videos').objectStore('videos').get(key); g.onsuccess = () => res(g.result); g.onerror = () => rej(g.error); });
        return blob ? (urls[key] = URL.createObjectURL(blob)) : null;
      }catch(e){ return null; }
    },
    clear(){ try{ indexedDB.deleteDatabase('reelcheck'); p = null; }catch(e){} }
  };
})();

/* ---------------------------------------------------------------------
   helpers
   --------------------------------------------------------------------- */
function uid(p){ return p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-3); }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, w, ws) => n + ' ' + (n === 1 ? w : (ws || w + 's'));
const when = t => new Date(t).toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : when(t); };
const creator = id => S.creators.find(c => c.id === id);
const versions = cid => (S.subs[cid] && S.subs[cid].versions) || [];
const version = (cid, n) => versions(cid).find(v => v.n === n);
const latest = cid => { const v = versions(cid); return v[v.length - 1]; };
const item = id => S.campaign && S.campaign.items.find(i => i.id === id);
const initials = n => (n.replace(/^@/,'').split(/[\s._-]+/).filter(Boolean).slice(0,2).map(w => w[0]).join('') || '?').toUpperCase();
const hue = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const avatar = n => `<span class="av" style="background:hsl(${hue(n)} 45% 82%)" aria-hidden="true">${esc(initials(n))}</span>`;

const svg = (p, cls = 'i') => `<svg class="${cls}" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P_ = {
  grid:'<rect x="3" y="3" width="6" height="6" rx="1.6"/><rect x="11" y="3" width="6" height="6" rx="1.6"/><rect x="3" y="11" width="6" height="6" rx="1.6"/><rect x="11" y="11" width="6" height="6" rx="1.6"/>',
  list:'<path d="M8.5 5h8.5M8.5 10h8.5M8.5 15h8.5"/><path d="M3.3 5l1 1 1.8-2.2M3.3 10l1 1 1.8-2.2M3.3 15l1 1 1.8-2.2"/>',
  doc:'<path d="M5 2.5h6.5L15.5 6.5v11H5z"/><path d="M11 2.5v4h4.5M7.5 10.5h5M7.5 13.5h5"/>',
  caption:'<path d="M3.5 5.5h13M3.5 10h13M3.5 14.5h8"/>',
  speech:'<rect x="7.3" y="2.5" width="5.4" height="9.5" rx="2.7"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/>',
  manual:'<path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z"/><circle cx="10" cy="10" r="2.3"/>',
  plus:'<path d="M10 4.5v11M4.5 10h11"/>',

const I = new Proxy({}, {get: (_, k) => svg(P_[k] || '')});
const Is = new Proxy({}, {get: (_, k) => svg(P_[k] || '', 'i i-sm')});

const KINDS = {
  speech: {name:'Spoken', desc:'Checked against what the creator says on camera. Any wording that covers the point counts.'},
  caption:{name:'Caption', desc:'Checked against the caption. Tags, handles and keywords must be there exactly.'},
  manual: {name:'Visual', desc:'The creator confirms these are in the video. You check them when you watch it.'}
};
const ORDER = ['speech','caption','manual'];
const LABEL = {brand:{pass:'Met', miss:'Missing', unsure:'Unclear'}, creator:{pass:'Done', miss:'To fix', unsure:'Unclear'}};
const kindTag = k => `<span class="kind-tag">${I[k]}${KINDS[k].name}</span>`;
const statusIcon = v => `<span class="si si-${v}" aria-hidden="true">${I[v] || ''}</span>`;
const logo = (text = true) => `<span class="glyph">${svg(P_.play)}</span>${text ? '<span>Reel Check</span>' : ''}`;

function evidenceText(it, r, who){
  if(it.kind === 'manual'){
    if(who === 'creator') return r.verdict === 'pass' ? 'You confirmed it’s in your reel.' : 'Tick it once it’s in your reel.';
    return r.verdict === 'pass' ? 'Creator confirmed it’s in the video. Check it when you watch.' : 'Creator hasn’t confirmed this is in the video.';
  }
  return r.evidence || '';
}
const evHtml = (it, r, who) => { const t = evidenceText(it, r, who); return t ? `<span class="ev ${r.quote ? 'quote' : ''}">${r.quote ? '“' + esc(t.replace(/^["“]|["”]$/g,'')) + '”' : esc(t)}</span>` : ''; };

function reviewOf(v){ return v.review || {changes:{}, overrides:{}, decision:null}; }
function verdictsFor(v){
  const stored = v.results || {}, auto = {}, out = {}, rv = reviewOf(v);
  S.campaign.items.forEach(it => {
    auto[it.id] = stored[it.id] || (v.results ? {verdict:'unsure', evidence:'Added to the checklist after this version was sent.'} : runCheck(it, v));
    out[it.id] = rv.overrides[it.id] || auto[it.id].verdict;
  });
  return {auto, out, rv};
}
const counts = out => { const vs = Object.values(out); return {met: vs.filter(v => v === 'pass').length, miss: vs.filter(v => v === 'miss').length, unc: vs.filter(v => v === 'unsure').length, total: vs.length}; };
function statusOf(cid){
  const v = latest(cid);
  if(!v) return {key:'waiting', text:'Waiting for reel'};
  const d = v.review && v.review.decision;
  if(!d) return {key:'review', text:'Needs review'};
  if(d === 'approved') return {key:'approved', text:'Approved'};
  return {key:'changes', text:'Changes requested'};
}
const pill = st => `<span class="pill p-${st.key}">${st.text}</span>`;
function linkFor(cid){ return `${location.href.split(/[?#]/)[0]}?c=${encodeURIComponent(S.campaign.id)}&u=${encodeURIComponent(cid)}`; }
function meter(out){
  const c = counts(out), w = n => (n / c.total * 100) + '%';
  return `<div class="meter" aria-hidden="true"><span class="m" style="width:${w(c.met)}"></span><span class="u" style="width:${w(c.unc)}"></span><span class="x" style="width:${w(c.miss)}"></span></div>
    <div class="meter-l">${c.met} of ${c.total} met${c.miss ? ` · ${c.miss} missing` : ''}${c.unc ? ` · ${c.unc} unclear` : ''}</div>`;
}
function menu(label, items){
  return `<details class="menu"><summary class="icon-btn" aria-label="${esc(label)}">${I.dots}</summary><div class="menu-pop" role="menu">${items.join('')}</div></details>`;
}
let toastT;
function toast(msg, icon = 'pass'){
  const t = document.getElementById('toast'); t.innerHTML = svg(P_[icon]) + esc(msg); t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
async function copyLink(cid, quiet){
  const url = linkFor(cid);
  try{ await navigator.clipboard.writeText(url); if(!quiet) toast('Link copied'); return true; }
  catch(e){ if(!quiet) prompt('Copy this link and send it to the creator', url); return false; }
}

const UI = {busy:false, warn:'', draftBrief:null, wizStep:null, editing:null, adding:null, addOpen:false, ask:null, more:false, briefEdit:false};
const setupDone = () => S.campaign && (!S.campaign.setup || S.campaign.setup === 'done');

function brandApp(){
  if(!setupDone()) return wizard();
  const [r, a, b] = location.hash.slice(1).split('/');
  const page = ['overview','checklist','brief','review'].includes(r) ? r : 'overview';
  const body = page === 'checklist' ? pageChecklist()
    : page === 'brief' ? pageBrief()
    : page === 'review' && a ? pageReview(a, b ? +b : null)
    : pageOverview();
  const nr = S.creators.filter(c => statusOf(c.id).key === 'review').length;
  const nav = [['overview','Creators', I.users, nr], ['checklist','Checklist', I.list], ['brief','Brief', I.doc]];
  const on = page === 'review' ? 'overview' : page;
  return `<div class="app">
    <aside class="side">
      <a class="logo" href="#overview">${logo()}</a>
      <div class="camp-box"><div class="k">Campaign</div><div class="t">${esc(S.campaign.title)}</div></div>
      <nav class="nav" aria-label="Main">${nav.map(([k, l, ic, n]) => `<a href="#${k}" ${on === k ? 'aria-current="page"' : ''}>${ic}${l}${n ? `<span class="badge" title="${n} to review">${n}</span>` : ''}</a>`).join('')}</nav>
      <div class="side-foot">Demo build. Everything is saved in this browser.<br><button data-act="reset">Start a new campaign</button></div>
    </aside>
    <div class="main">${body}</div>
  </div>`;
}

/* ---------- checklist editor (wizard + checklist page) ---------- */
function checklistEditor(){
  let n = 0;
  return `<div class="groups">${ORDER.map(k => {
    const items = S.campaign.items.filter(i => i.kind === k);
    return `<section class="card">
      <div class="group-h"><span class="gi gi-${k}">${I[k]}</span><div><h3>${KINDS[k].name} <span class="count">${items.length}</span></h3><p>${KINDS[k].desc}</p></div></div>
      <ol class="reqs">${items.map(it => reqRow(it, ++n)).join('')}</ol>
      ${UI.adding === k ? `<div class="add-form"><input class="input" id="addtext" placeholder="Describe the requirement…" aria-label="New requirement">
          <button class="btn primary" data-act="addsave" data-kind="${k}">Add</button><button class="btn ghost" data-act="addcancel">Cancel</button></div>`
        : `<button class="add-req" data-act="addopen" data-kind="${k}">${I.plus} Add a ${KINDS[k].name.toLowerCase()} requirement</button>`}
    </section>`;

}
function reqRow(it, n){
  if(UI.editing === it.id) return `<li class="req editing"><span class="num">${n}</span><input class="input" id="edittext" value="${esc(it.text)}" aria-label="Requirement">

}

/* ---------- overview ---------- */
function pageOverview(){
  const cs = S.creators, st = cs.map(c => statusOf(c.id).key);
  const n = k => st.filter(x => x === k).length;
  const stats = [['Needs review', n('review'), 'var(--unc)'], ['Changes requested', n('changes'), 'var(--req)'], ['Approved', n('approved'), 'var(--met)'], ['Waiting for reel', n('waiting'), 'var(--wait)']];
  const order = {review:0, changes:1, waiting:2, approved:3};
  const rows = cs.slice().sort((a, b) => order[statusOf(a.id).key] - order[statusOf(b.id).key]).map(c => {
    const s = statusOf(c.id), v = latest(c.id);
    return `<tr>

      <td class="c-status">${pill(s)}</td>

      <td class="c-acts"><div class="row-acts">

  }).join('');
  const addForm = `<form class="add-bar" data-form="creator" autocomplete="off">

    <header class="page-head">

      <div class="card">
        ${cs.length ? `${UI.addOpen ? addForm : ''}

/* ---------- review ---------- */
function pageReview(cid, nSel){
  const c = creator(cid), all = versions(cid);
  if(!c || !all.length) return `<div class="content" style="padding-top:40px"><div class="card empty"><h3>Nothing to review</h3><p>This creator hasn't sent a reel yet.</p><a class="btn" href="#overview">Back to creators</a></div></div>`;
  const v = (nSel && version(cid, nSel)) || all[all.length - 1];
  const isLatest = v === all[all.length - 1];
  const {auto, out, rv} = verdictsFor(v);
  const editable = isLatest && !rv.decision;
  const nCh = Object.keys(rv.changes).length, k = counts(out);
  const items = S.campaign.items;
  const attention = items.filter(i => out[i.id] !== 'pass' || rv.changes[i.id]);
  const met = items.filter(i => out[i.id] === 'pass' && !rv.changes[i.id]);

  const row = it => {
    const a = auto[it.id], shown = out[it.id], ch = rv.changes[it.id], over = rv.overrides[it.id];
    const marks = ['pass','miss','unsure'].filter(x => x !== shown).map(x => `<button data-act="ov" data-id="${it.id}" data-v="${x}">${Is[x]} Mark as ${LABEL.brand[x].toLowerCase()}</button>`);
    if(over) marks.push(`<hr><button data-act="ov" data-id="${it.id}" data-v="">${Is.back} Use the automatic result</button>`);
    return `<li class="res">
      ${statusIcon(shown)}
      <div>
        <p class="res-t">${esc(it.text)}</p>
        <div class="res-meta">${kindTag(it.kind)}${evHtml(it, shown === a.verdict ? a : {verdict:shown}, 'brand')}</div>
        ${over ? `<p class="over-note">You marked this ${LABEL.brand[over].toLowerCase()}. The automatic check said ${LABEL.brand[a.verdict].toLowerCase()}.</p>` : ''}
        ${ch && UI.ask !== it.id ? `<div class="ask"><div class="k">${Is.change} ${editable ? 'Change request' : 'You asked'}</div><p>${esc(ch.note)}</p></div>` : ''}
        ${editable && UI.ask === it.id ? `<div class="ask-form">
          <textarea class="input" id="asktext" rows="2" placeholder="What should ${esc(c.name)} change?" aria-label="Change request">${esc(ch ? ch.note : '')}</textarea>
          <div class="row"><button class="btn sm primary" data-act="asksave" data-id="${it.id}">Save request</button><button class="btn sm ghost" data-act="askcancel">Cancel</button>
          ${ch ? `<button class="btn sm ghost" data-act="askremove" data-id="${it.id}" style="margin-left:auto">${Is.trash} Remove</button>` : ''}</div></div>` : ''}
      </div>
      ${editable && UI.ask !== it.id ? `<div class="res-acts"><button class="btn sm" data-act="askopen" data-id="${it.id}">${ch ? 'Edit request' : 'Request change'}</button>${menu('Override result', marks)}</div>` : ''}
    </li>`;
  };
  const decide = editable ? `<button class="btn primary" data-act="sendreview" data-id="${cid}" data-n="${v.n}">${nCh ? `${Is.send} Send ${plural(nCh, 'change request')}` : `${Is.pass} Approve reel`}</button>` : '';
  const banner = rv.decision === 'approved' ? `<div class="banner met">${I.pass} You approved version ${v.n} · ${when(rv.at)}</div>`
    : rv.decision === 'changes' ? `<div class="banner req">${I.change} You sent ${plural(nCh, 'change request')} on version ${v.n} · ${when(rv.at)}${isLatest ? `. Waiting for ${esc(c.name)}'s next version.` : ''}</div>`
    : !isLatest ? `<div class="banner req">${I.info} This is an older version. <a href="#review/${cid}" style="margin-left:4px">See the latest</a></div>` : '';

  return `
    <header class="page-head">
      <div><a class="crumb" href="#overview">${I.back} Creators</a><h1>${avatar(c.name)}${esc(c.name)} ${pill(statusOf(cid))}</h1></div>
      <div class="acts desk">${decide}</div>
    </header>
    <div class="content">
      ${banner}
      <div class="rv">
        <div class="rv-left">
          <div class="card vcard">
            <div class="frame" data-video="${cid}#${v.n}"><div class="nofile">${v.hasVideo ? '<span class="spin"></span>' : `${I.film}<span>No video file was attached to this version.</span>`}</div></div>
            <div class="vmeta">
              ${all.length > 1 ? `<nav class="seg" aria-label="Versions">${all.map(x => `<a href="#review/${cid}/${x.n}" ${x === v ? 'aria-current="true"' : ''}>v${x.n}</a>`).join('')}</nav>` : `<span class="small" style="font-weight:500">Version ${v.n}</span>`}
              <span class="faint small">Sent ${when(v.sentAt)}</span>
            </div>
          </div>
          <div class="card textcard"><div class="card-b"><div class="k">Caption</div><div class="v">${v.caption ? esc(v.caption) : '<span class="none">No caption</span>'}</div></div></div>
          <div class="card textcard"><div class="card-b"><div class="k">Said on camera</div><div class="v ${UI.more ? '' : 'clamp'}">${v.script ? esc(v.script) : '<span class="none">Nothing pasted</span>'}</div>
            ${v.script && v.script.length > 260 ? `<button data-act="more">${UI.more ? 'Show less' : 'Show all'}</button>` : ''}</div></div>
        </div>
        <div class="card">
          <div class="card-h"><h2>Checklist results</h2>
            <div class="sum"><span><i style="background:var(--met)"></i>${k.met} met</span><span><i style="background:var(--miss)"></i>${k.miss} missing</span><span><i style="background:var(--unc)"></i>${k.unc} unclear</span></div></div>
          ${attention.length ? `<div class="sec-l">Needs your attention · ${attention.length}</div><ol class="res-list">${attention.map(row).join('')}</ol>`
            : `<div class="allgood">${I.pass} Everything on the checklist is met.</div>`}
          ${met.length ? `<details class="fold" ${attention.length ? '' : 'open'}><summary class="sec-l" style="border-top:1px solid var(--border)">Met · ${met.length} ${svg(P_.chev, 'chev')}</summary><ol class="res-list">${met.map(row).join('')}</ol></details>` : ''}
        </div>
      </div>
    </div>
    ${editable ? `<div class="mob-dock"><span>${nCh ? plural(nCh, 'change request') : 'No changes requested'}</span>${decide}</div>` : ''}`;
}

const Q = new URLSearchParams(location.search);
const CID = Q.get('u'), CAMP = Q.get('c');
const CR = {screen:null, draft:null, results:null, by:null, n:null, warn:''};

function creatorDefault(){
  const v = latest(CID);
  if(!v) return 'form';
  return v.review && v.review.decision === 'changes' ? 'form' : 'sent';
}
function ensureDraft(){
  if(CR.draft) return;
  const v = latest(CID);
  CR.draft = {caption: v ? v.caption : '', script: v ? v.script : '', ticks: v ? {...v.ticks} : {}, file:null, url:null};
}
function creatorApp(){
  const c = creator(CID);
  const top = `<header class="ctop"><div class="ctop-in"><span class="logo">${logo()}</span>${S.campaign ? `<span class="camp">${esc(S.campaign.title)}</span>` : ''}
    ${c ? `<span class="me">${avatar(c.name)}${esc(c.name)}</span>` : ''}</div></header>`;
  if(!S.campaign || !c || (CAMP && S.campaign.id !== CAMP))
    return top + `<div class="cwrap"><div class="card empty" style="max-width:560px;margin:40px auto"><span class="ic">${I.info}</span><h3>This link isn't set up in this browser</h3>
      <p>In this demo, links only open in the same browser the brand used to set up the campaign.</p></div></div>`;
  if(!CR.screen) CR.screen = creatorDefault();
  const body = CR.screen === 'checking' ? viewChecking() : CR.screen === 'result' ? viewResult() : CR.screen === 'sent' ? viewSent() : viewForm();
  return top + `<div class="cwrap">${body}</div>`;
}

function viewForm(){
  ensureDraft();
  const d = CR.draft, v = latest(CID), items = S.campaign.items, next = v ? v.n + 1 : 1;
  const asked = v && v.review && v.review.decision === 'changes' ? Object.entries(v.review.changes) : [];
  const manual = items.filter(i => i.kind === 'manual');
  return `
    <div class="chead">
      <p class="eyebrow">${v ? `Version ${next}` : 'New submission'}</p>
      <h1>${v ? 'Send your updated reel' : 'Submit your reel'}</h1>
      <p class="sub">Add your reel, caption and script. It's checked against the brief right away, and you see the result before the brand does.</p>
    </div>
    <div class="cgrid">
      <div class="cleft">
        <div class="card vcard">
          ${d.url ? `<div class="frame"><video src="${d.url}" controls playsinline></video></div>
            <div class="file-row"><span>${esc(d.file.name)}</span><label class="btn sm" style="cursor:pointer">Replace<input type="file" accept="video/*" class="sr" data-act="file"></label></div>`
          : `<label class="drop" data-drop><input type="file" accept="video/*" class="sr" data-act="file"><span class="ic">${I.upload}</span><b>Upload your reel</b><small>Drag a video here or tap to choose.<br>Portrait works best.</small></label>`}
        </div>
        <details class="card fold"><summary class="fold-h">What the brand wants · ${items.length} ${svg(P_.chev, 'chev')}</summary>
          <ol class="brief-list">${items.map(i => `<li><span>${esc(i.text)}</span>${kindTag(i.kind)}</li>`).join('')}</ol></details>
      </div>
      <div class="cright">
        ${asked.length ? `<section class="card callout"><h3>${I.change} The brand requested ${plural(asked.length, 'change')}</h3>
          <ol>${asked.map(([id, ch]) => `<li><p>${esc(ch.note)}</p><small>On: ${esc((item(id) || ch).text)}</small></li>`).join('')}</ol></section>` : ''}
        <section class="card card-b">
          <div class="step-h"><span class="step-n">1</span><div><h3>Caption</h3><p>Paste it exactly as you'll post it, tags included.</p></div></div>
          <textarea class="input" id="cap" rows="3" data-draft="caption" placeholder="Your caption…" aria-label="Caption">${esc(d.caption)}</textarea>
        </section>
        <section class="card card-b">
          <div class="step-h"><span class="step-n">2</span><div><h3>What you say on camera</h3><p>Paste your voiceover or script. Your own words are fine.</p></div></div>
          <textarea class="input" id="scr" rows="5" data-draft="script" placeholder="Everything you say in the reel…" aria-label="What you say on camera">${esc(d.script)}</textarea>
        </section>
        ${manual.length ? `<section class="card card-b">
          <div class="step-h"><span class="step-n">3</span><div><h3>Confirm what's in your video</h3><p>Tick only what's really in the reel. The brand checks these when they watch.</p></div></div>
          <div class="ticks">${manual.map(i => `<label class="tick"><input type="checkbox" class="sr" data-act="tick" data-id="${i.id}" ${d.ticks[i.id] ? 'checked' : ''}><span class="box">${I.pass}</span><span>${esc(i.text)}</span></label>`).join('')}</div>
        </section>` : ''}
        <div class="card submit-bar">
          <p>${CR.warn ? `<span style="color:var(--miss)">${esc(CR.warn)}</span>` : 'Nothing is sent to the brand until you choose to.'}</p>
          <button class="btn primary lg" data-act="check">${I.spark} Check my reel</button>
        </div>
      </div>
    </div>`;
}

function viewChecking(){
  return `<div class="checking"><div class="card">
    <div class="card-h" style="justify-content:flex-start; gap:16px"><span class="ring-spin"><span class="spin"></span></span>
      <div><h1>Checking version ${CR.n}</h1><p>Reading your caption and script against ${plural(S.campaign.items.length, 'requirement')}. This takes a few seconds.</p></div></div>
    <ol class="res-list live" aria-live="polite">${S.campaign.items.map(it => `<li class="res pending" data-id="${it.id}"><span class="si si-pending"></span>
      <div><p class="res-t">${esc(it.text)}</p><div class="res-meta">${kindTag(it.kind)}</div></div></li>`).join('')}</ol>
  </div></div>`;
}
async function startChecking(){
  const d = CR.draft;
  if(!d.url && !d.caption.trim() && !d.script.trim()){ CR.warn = 'Add your reel, caption or script first.'; render(); return; }
  CR.warn = '';
  const v = latest(CID); CR.n = v ? v.n + 1 : 1;
  CR.screen = 'checking'; render(); scrollTo(0, 0);
  const t0 = Date.now();
  const {results, by} = await checkSubmission(d);
  CR.results = results; CR.by = by;
  await new Promise(r => setTimeout(r, Math.max(0, 1200 - (Date.now() - t0))));
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lis = [...document.querySelectorAll('.live > li')];
  const step = calm ? 20 : 170;
  lis.forEach((li, i) => setTimeout(() => {
    const it = item(li.dataset.id), r = results[li.dataset.id]; if(!it || !r) return;
    li.className = 'res landed';
    li.innerHTML = `${statusIcon(r.verdict)}<div><p class="res-t">${esc(it.text)}</p><div class="res-meta"><span class="kind-tag" style="color:var(--${r.verdict === 'pass' ? 'met' : r.verdict === 'miss' ? 'miss' : 'unc'})">${LABEL.creator[r.verdict]}</span>${evHtml(it, r, 'creator')}</div></div>`;
    if(!calm) li.scrollIntoView({block:'nearest', behavior:'smooth'});
  }, i * step));
  setTimeout(() => { if(CR.screen === 'checking'){ CR.screen = 'result'; render(); scrollTo(0, 0); } }, lis.length * step + 900);
}

function resultRow(it, r){
  return `<li class="res">${statusIcon(r.verdict)}<div><p class="res-t">${esc(it.text)}</p><div class="res-meta">${kindTag(it.kind)}${evHtml(it, r, 'creator')}</div></div></li>`;
}
function ring(met, total){
  const C = 2 * Math.PI * 56, f = total ? met / total : 0;
  return `<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--sunken)" stroke-width="10"/>
    <circle cx="66" cy="66" r="56" fill="none" stroke="var(--met)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C * f} ${C}"/></svg>
    <div class="n"><b>${met}/${total}</b><small>met</small></div></div>`;
}
function viewResult(){
  const r = CR.results, items = S.campaign.items;
  const vs = items.map(i => r[i.id].verdict), met = vs.filter(v => v === 'pass').length, miss = vs.filter(v => v === 'miss').length, unc = vs.filter(v => v === 'unsure').length;
  const title = miss ? `${plural(miss, 'thing')} to fix` : unc ? 'Almost there' : 'Everything checks out';
  const msg = miss ? `Fix ${miss === 1 ? 'it' : 'them'} and check again, or send it as it is.${unc ? ` ${unc} ${unc === 1 ? 'line is' : 'lines are'} unclear, and the brand will judge ${unc === 1 ? 'it' : 'those'}.` : ''}`
    : unc ? `${unc} ${unc === 1 ? 'line is' : 'lines are'} unclear, and the brand will make the call. Send it when you're ready.`
    : 'Your reel covers the whole brief. Send it to the brand.';
  const todo = items.filter(i => r[i.id].verdict !== 'pass'), done = items.filter(i => r[i.id].verdict === 'pass');
  return `
    <div class="chead"><p class="eyebrow">Version ${CR.n} · checked, not sent yet</p><h1>Here's how your reel did</h1></div>
    <div class="cgrid">
      <div class="cleft"><div class="card score">
        ${ring(met, items.length)}
        <h2>${title}</h2><p>${msg}</p>
        ${CR.by === 'simple' ? '<p class="faint small" style="margin-top:6px">AI was unavailable, so a simpler word match was used.</p>' : ''}
        ${CR.draft.url ? '' : '<p class="small" style="color:var(--miss); margin-top:6px">No video attached. The brand will only see your text.</p>'}
        <div class="acts">
          <button class="btn primary lg" data-act="send">${I.send} Send to the brand</button>
          <button class="btn lg" data-act="edit">${I.edit} Edit and check again</button>
        </div>
      </div></div>
      <div class="card">
        ${todo.length ? `<div class="sec-l" style="padding-top:18px">To look at · ${todo.length}</div><ol class="res-list">${todo.map(i => resultRow(i, r[i.id])).join('')}</ol>` : ''}
        ${done.length ? `<div class="sec-l" style="padding-top:18px; ${todo.length ? 'border-top:1px solid var(--border)' : ''}">Done · ${done.length}</div><ol class="res-list">${done.map(i => resultRow(i, r[i.id])).join('')}</ol>` : ''}
      </div>
    </div>`;
}

function viewSent(){
  const v = latest(CID), all = versions(CID).slice().reverse();
  const approved = v.review && v.review.decision === 'approved';
  return `
    <div class="cgrid" style="margin-top:8px">
      <div class="cleft"><div class="card score">
        <span class="success-ic" style="background:var(--${approved ? 'met' : 'req'}-bg); color:var(--${approved ? 'met' : 'req'})">${approved ? I.pass : I.send}</span>
        <h2>${approved ? `Version ${v.n} is approved` : `Version ${v.n} is with the brand`}</h2>
        <p>${approved ? 'Nothing else to do. Thanks for a great reel.' : 'Their feedback will appear on this same link, attached to the exact line it’s about. Keep this link handy.'}</p>
        ${approved ? '' : `<div class="acts"><button class="btn lg" data-act="newversion">${I.upload} Send a new version</button></div>`}
      </div></div>
      <div class="card">
        <div class="card-h"><h2>Your versions</h2><span class="faint small">${plural(all.length, 'version')}</span></div>
        <ol class="hist">${all.map(x => {
          const d = x.review && x.review.decision;
          const st = d === 'approved' ? pill({key:'approved', text:'Approved'}) : d === 'changes' ? pill({key:'changes', text:`${plural(Object.keys(x.review.changes).length, 'change')} requested`})
            : x === v ? pill({key:'review', text:'With the brand'}) : pill({key:'waiting', text:'Replaced'});
          const notes = d === 'changes' ? Object.values(x.review.changes).map(ch => `<div class="ask"><p>${esc(ch.note)}</p></div>`).join('') : '';
          return `<li><span class="vn">v${x.n}</span><div><span class="when">Sent ${when(x.sentAt)}</span>${notes}</div>${st}</li>`;
        }).join('')}</ol>
      </div>
    </div>`;
}

/* =====================================================================
   render + events
   ===================================================================== */
const MODE_CREATOR = !!CID;
function render(){
  document.getElementById('app').innerHTML = MODE_CREATOR ? creatorApp() : brandApp();
  hydrate();
}
function grow(t){ if(t.id === 'brief') return; t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }
function hydrate(){
  document.querySelectorAll('textarea').forEach(grow);
  document.querySelectorAll('[data-video]').forEach(async f => {
    const url = await vids.url(f.dataset.video);
    if(url) f.innerHTML = `<video src="${url}" controls playsinline preload="metadata"></video>`;
    else if(f.querySelector('.spin')) f.innerHTML = `<div class="nofile">${I.film}<span>The video file isn't on this device.</span></div>`;
  });
  if(UI.refocus){ const el = document.querySelector(UI.refocus); if(el){ el.focus(); if(el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } UI.refocus = null; }
}
const save = () => api.saveCampaign(S.campaign);
const reviewTarget = () => { const [, cid, n] = location.hash.slice(1).split('/'); const v = n ? version(cid, +n) : latest(cid); v.review = v.review || {changes:{}, overrides:{}, decision:null}; return {cid, v}; };

async function addCreator(name){
  const c = await api.registerCreator(name);
  const copied = await copyLink(c.id, true);
  UI.refocus = '#cname'; render();
  toast(copied ? `${name} added · link copied` : `${name} added`);
}
async function build(text, rebuild){
  if(!text.trim()){ UI.warn = 'Paste a brief first.'; render(); return; }
  UI.busy = true; UI.warn = ''; UI.draftBrief = text; render();
  const {items, by} = await buildChecklist(text);
  UI.busy = false;
  if(!items.length){ UI.warn = 'No requirements found. Put each one on its own line and try again.'; render(); return; }
  UI.draftBrief = null;
  S.campaign = {...(S.campaign || {id: uid('c'), createdAt: Date.now(), setup:'checklist'}), title: titleOf(text), brief: text, items, builtBy: by};
  await save();
  if(rebuild){ UI.briefEdit = false; location.hash = '#checklist'; render(); toast('Checklist rebuilt'); }
  else { UI.wizStep = null; S.campaign.setup = 'checklist'; await save(); render(); scrollTo(0, 0); }
}

document.addEventListener('click', async e => {
  document.querySelectorAll('details.menu[open]').forEach(m => { if(!m.contains(e.target) || e.target.closest('.menu-pop button, .menu-pop a')) m.open = false; });
  const b = e.target.closest('[data-act]'); if(!b || b.tagName === 'INPUT') return;
  const act = b.dataset.act, id = b.dataset.id;

  // setup + checklist
  if(act === 'sample'){ UI.draftBrief = SAMPLE; render(); }
  if(act === 'build') build(document.getElementById('brief').value, false);
  if(act === 'rebuild') build(document.getElementById('brief').value, true);
  if(act === 'wizback'){ UI.wizStep = S.campaign.setup === 'creators' ? 'checklist' : 'brief'; if(UI.wizStep === 'checklist'){ S.campaign.setup = 'checklist'; await save(); UI.wizStep = null; } render(); scrollTo(0, 0); }
  if(act === 'wiznext'){ S.campaign.setup = b.dataset.to; UI.wizStep = null; await save(); if(b.dataset.to === 'done') location.hash = '#overview'; render(); scrollTo(0, 0); }
  if(act === 'editopen'){ UI.editing = id; UI.adding = null; UI.refocus = '#edittext'; render(); }
  if(act === 'editcancel'){ UI.editing = null; render(); }
  if(act === 'editsave'){ const t = document.getElementById('edittext').value.trim(), it = item(id); if(t){ it.text = t; it.terms = termsFor(t, it.kind); await save(); } UI.editing = null; render(); }
  if(act === 'move'){ const it = item(id); it.kind = b.dataset.kind; it.terms = termsFor(it.text, it.kind); await save(); render(); toast(`Moved to ${KINDS[it.kind].name}`); }
  if(act === 'rmitem'){ S.campaign.items = S.campaign.items.filter(i => i.id !== id); await save(); render(); toast('Requirement deleted', 'trash'); }
  if(act === 'addopen'){ UI.adding = b.dataset.kind; UI.editing = null; UI.refocus = '#addtext'; render(); }
  if(act === 'addcancel'){ UI.adding = null; render(); }
  if(act === 'addsave'){ const t = document.getElementById('addtext').value.trim(); if(t){ S.campaign.items.push({id: uid('i'), text: t, kind: b.dataset.kind, terms: termsFor(t, b.dataset.kind)}); await save(); } UI.adding = null; render(); }
  if(act === 'briefedit'){ UI.briefEdit = true; render(); }
  if(act === 'briefcancel'){ UI.briefEdit = false; UI.draftBrief = null; UI.warn = ''; render(); }

  // creators
  if(act === 'copy') copyLink(id);
  if(act === 'addopenc'){ UI.addOpen = true; UI.refocus = '#cname'; render(); }
  if(act === 'addclose'){ UI.addOpen = false; render(); }
  if(act === 'reset'){
    if(!confirm('Start a new campaign? This clears the current campaign, creators and reels saved in this browser.')) return;
    await api.reset(); vids.clear(); Object.assign(UI, {draftBrief:null, wizStep:null, warn:''}); location.hash = ''; render();
  }

  // review
  if(act === 'more'){ UI.more = !UI.more; render(); }
  if(act === 'askopen'){ UI.ask = id; UI.refocus = '#asktext'; render(); }
  if(act === 'askcancel'){ UI.ask = null; render(); }
  if(act === 'asksave' || act === 'askremove'){
    const {cid, v} = reviewTarget(), note = act === 'asksave' ? document.getElementById('asktext').value.trim() : '';
    if(note) v.review.changes[id] = {note, text: item(id).text}; else delete v.review.changes[id];
    UI.ask = null; await api.review(cid, v.n, v.review); render();
  }
  if(act === 'ov'){
    const {cid, v} = reviewTarget();
    if(b.dataset.v) v.review.overrides[id] = b.dataset.v; else delete v.review.overrides[id];
    await api.review(cid, v.n, v.review); render();
  }
  if(act === 'sendreview'){
    const {cid, v} = reviewTarget(), k = Object.keys(v.review.changes).length;
    v.review.decision = k ? 'changes' : 'approved'; v.review.at = Date.now();
    await api.review(cid, v.n, v.review); render();
    toast(k ? `Sent to ${creator(cid).name}` : 'Reel approved');
  }

  // creator
  if(act === 'check') startChecking();
  if(act === 'edit'){ CR.screen = 'form'; render(); scrollTo(0, 0); }
  if(act === 'newversion'){ CR.draft = null; CR.screen = 'form'; render(); scrollTo(0, 0); }
  if(act === 'send'){
    const d = CR.draft; b.disabled = true;
    if(d.file) await vids.put(`${CID}#${CR.n}`, d.file, d.url);
    await api.submit(CID, {n: CR.n, caption: d.caption, script: d.script, ticks: {...d.ticks}, results: CR.results, checkedBy: CR.by, hasVideo: !!d.file, sentAt: Date.now()});
    CR.draft = null; CR.screen = 'sent'; render(); scrollTo(0, 0);
  }
});

function setFile(f){
  if(!f || !CR.draft) return;
  if(CR.draft.url) URL.revokeObjectURL(CR.draft.url);
  CR.draft.file = f; CR.draft.url = URL.createObjectURL(f); CR.warn = ''; render();
}
document.addEventListener('input', e => {
  const t = e.target;
  if(t.tagName === 'TEXTAREA') grow(t);
  if(t.id === 'brief') UI.draftBrief = t.value;
  if(t.dataset.draft && CR.draft) CR.draft[t.dataset.draft] = t.value;
});
document.addEventListener('change', e => {
  const t = e.target, act = t.dataset.act;
  if(act === 'tick' && CR.draft) CR.draft.ticks[t.dataset.id] = t.checked;
  if(act === 'file') setFile(t.files[0]);
});
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if(d){ e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if(d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if(d){ e.preventDefault(); setFile(e.dataTransfer.files[0]); } });
document.addEventListener('keydown', e => {
  const t = e.target;
  if(e.key === 'Enter' && !e.shiftKey){
    if(t.id === 'edittext'){ e.preventDefault(); document.querySelector('[data-act=editsave]').click(); }
    if(t.id === 'addtext'){ e.preventDefault(); document.querySelector('[data-act=addsave]').click(); }
  }
  if(e.key === 'Escape'){
    document.querySelectorAll('details.menu[open]').forEach(m => m.open = false);
    if(UI.ask || UI.editing || UI.adding){ UI.ask = UI.editing = UI.adding = null; render(); }
  }
});
document.addEventListener('submit', e => {
  if(e.target.dataset.form !== 'creator') return;
  e.preventDefault();
  const inp = e.target.querySelector('#cname'), name = inp.value.trim();
  if(!name){ inp.focus(); return; }
  addCreator(name);
});
addEventListener('hashchange', () => { Object.assign(UI, {ask:null, more:false, editing:null, adding:null, briefEdit:false, addOpen:false}); render(); scrollTo(0, 0); });

/* The brand's tab and the creator's tab share storage: pick up the other
   side's changes live, but never under someone's cursor. */
let stale = false;
function refresh(){
  const a = document.activeElement;
  if((a && /^(TEXTAREA|INPUT)$/.test(a.tagName)) || UI.ask || UI.editing || UI.busy || CR.screen === 'checking'){ stale = true; return; }
  stale = false;
  api.load().then(() => {
    if(MODE_CREATOR && CR.screen === 'sent') CR.screen = creatorDefault();
    const y = scrollY; render(); scrollTo(0, y);
  });
}
addEventListener('storage', e => { if(e.key === KEY) refresh(); });
document.addEventListener('focusout', () => setTimeout(() => { if(stale) refresh(); }, 0));

render();
</script>
</body>
</html>
